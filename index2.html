<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Khóa giao diện sáng: chặn trình duyệt (Cốc Cốc, Chrome, Dark Reader...) tự ép sang nền tối -->
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<title>Gửi mẹ và hai chị – Chúc mừng ngày Phụ nữ Việt Nam 20/10</title>
<meta name="description" content="Lời chúc 20/10 dành tặng mẹ và hai chị.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: only light;
    --blush: #fde8ee;
    --rose: #e9899f;
    --rose-deep: #b9476a;
    --lilac: #e9defa;
    --peach: #ffe3d3;
    --ink: #5a3345;
    --ink-soft: #85606f;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; color-scheme: only light; }
  body {
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.7;
    background-color: var(--blush);
    background-image:
      radial-gradient(60rem 40rem at 10% -10%, var(--lilac), transparent 60%),
      radial-gradient(50rem 40rem at 100% 10%, var(--peach), transparent 60%),
      radial-gradient(60rem 50rem at 50% 110%, #fbd5e0, transparent 60%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -40px;
    width: var(--s); height: calc(var(--s) * 1.3);
    background: linear-gradient(135deg, #fff 0%, #f7b6c8 100%);
    border-radius: 80% 0 80% 0;
    opacity: .75;
    animation: fall var(--d) linear var(--delay) infinite;
  }
  @keyframes fall { to { transform: translate3d(var(--x), 110vh, 0) rotate(520deg); } }
  main, footer { position: relative; z-index: 1; }

  .hero { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 4rem 1.5rem; }
  .hero-inner { max-width: 52rem; }
  .date {
    font-family: "Playfair Display", serif;
    font-size: clamp(5.5rem, 22vw, 13rem);
    font-weight: 700; line-height: 1; letter-spacing: -0.02em;
    background: linear-gradient(120deg, #f2a0b6, #c77ad0 55%, #f0a98a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 {
    font-family: "Playfair Display", serif; font-weight: 500;
    font-size: clamp(1.6rem, 4.6vw, 2.8rem); line-height: 1.25;
    margin-top: .5rem; color: var(--rose-deep);
  }
  .lead { margin: 1.5rem auto 2.2rem; max-width: 34rem; color: var(--ink-soft); font-weight: 300; font-size: 1.1rem; }

  .btn {
    font: inherit; font-weight: 500; border: 0; cursor: pointer;
    padding: .9rem 2rem; border-radius: 999px; color: #fff;
    background: linear-gradient(120deg, #e07e98, #c872bc);
    box-shadow: 0 10px 24px -10px rgba(185, 71, 106, .6);
    transition: transform .2s ease, box-shadow .2s ease;
    text-decoration: none; display: inline-block;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -10px rgba(185, 71, 106, .7); }
  .btn:focus-visible, .tab:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 3px; }

  section { padding: 4rem 1.5rem; }
  .wrap { max-width: 50rem; margin: 0 auto; }
  h2 {
    font-family: "Playfair Display", serif; font-weight: 500; font-style: italic;
    font-size: clamp(1.7rem, 4vw, 2.4rem); color: var(--rose-deep);
    text-align: center; margin-bottom: 2rem;
  }

  /* Chọn người nhận */
  .tabs { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; margin-bottom: 2rem; }
  .tab {
    font: inherit; font-weight: 500; cursor: pointer;
    padding: .7rem 1.5rem; border-radius: 999px;
    border: 1.5px solid #f2b9c9; background: rgba(255,255,255,.7); color: var(--rose-deep);
    transition: background .2s, color .2s, transform .2s;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab[aria-selected="true"] { background: linear-gradient(120deg, #e07e98, #c872bc); color: #fff; border-color: transparent; }

  /* Lá thư */
  .letter {
    position: relative;
    background: #fff;
    border-radius: 2rem;
    padding: clamp(2rem, 6vw, 3.8rem) clamp(1.6rem, 6vw, 4rem);
    box-shadow: 0 24px 60px -32px rgba(185, 71, 106, .55);
    border-top: 6px solid var(--accent, #f2a0b6);
  }
  .letter.swap { animation: swap .5s ease; }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .letter .emoji { font-size: 2.4rem; display: block; text-align: center; }
  .letter h3 {
    font-family: "Playfair Display", serif; font-weight: 500;
    font-size: clamp(1.5rem, 4vw, 2rem); text-align: center; margin: .4rem 0 1.4rem; color: var(--rose-deep);
  }
  .letter .body { font-size: 1.08rem; max-width: 38rem; margin: 0 auto; }
  .letter .body p + p { margin-top: 1rem; }
  .sign { margin-top: 1.8rem; text-align: right; font-family: "Playfair Display", serif; font-style: italic; font-size: 1.2rem; color: var(--rose-deep); }

  .wish-box { margin-top: 2rem; padding: 1.4rem 1.6rem; background: #fff5f8; border-radius: 1.4rem; text-align: center; }
  .wish-text { font-family: "Playfair Display", serif; font-size: 1.25rem; line-height: 1.5; min-height: 3.6rem; display: grid; place-items: center; margin-bottom: 1rem; }
  .btn-small { padding: .6rem 1.4rem; font-size: .95rem; }

  footer { text-align: center; padding: 3rem 1.5rem 4rem; color: var(--ink-soft); font-weight: 300; }
  footer strong { font-family: "Playfair Display", serif; font-weight: 500; color: var(--rose-deep); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .petal { display: none; }
    .letter.swap { animation: none; }
    .btn, .tab { transition: none; }
  }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<main>
  <header class="hero">
    <div class="hero-inner">
      <div class="date" aria-hidden="true">20/10</div>
      <h1>Chúc mừng ngày Phụ nữ Việt Nam</h1>
      <p class="lead">Gửi đến mẹ và hai chị, những người phụ nữ yêu thương nhất của con và em. Cảm ơn mọi người đã luôn ở bên cạnh.</p>
      <a class="btn" href="#thu">Đọc lời nhắn</a>
    </div>
  </header>

  <section id="thu">
    <div class="wrap">
      <h2>Những lời con muốn nói</h2>
      <div class="tabs" role="tablist" aria-label="Chọn người nhận" id="tabs"></div>
      <article class="letter" id="letter" role="tabpanel" aria-live="polite"></article>
    </div>
  </section>
</main>

<footer>
  <p><strong>20/10</strong> · Chúc mẹ và hai chị luôn xinh đẹp, bình an và hạnh phúc 🌸</p>
</footer>

<script>
  /* ====== CHỈNH NỘI DUNG Ở ĐÂY ======
     Đổi name, title, nội dung trong paragraphs/wishes và sign cho đúng với gia đình bạn. */
  var people = [
    {
      id: "me", name: "Mẹ", emoji: "🌹", accent: "#f2a0b6",
      title: "Gửi mẹ yêu của con",
      paragraphs: [
        "Mẹ ơi, cảm ơn mẹ vì đã dành cả thanh xuân để lo cho các con. Những bữa cơm mẹ nấu, những đêm mẹ thức chờ con về, những lời dặn dò tưởng chừng nhỏ bé, tất cả đã nuôi con lớn lên từng ngày.",
        "Nhân ngày 20/10, con chúc mẹ thật nhiều sức khỏe, nhiều niềm vui và luôn bình an. Mẹ hãy nghỉ ngơi nhiều hơn, để các con chăm sóc mẹ nhé. Con yêu mẹ rất nhiều."
      ],
      wishes: [
        "Chúc mẹ luôn khỏe mạnh, tươi trẻ và mỉm cười thật nhiều.",
        "Mẹ là người phụ nữ tuyệt vời nhất của con. Hôm nay mẹ chỉ cần vui thôi nhé!",
        "Mong mẹ luôn cảm nhận được tình yêu của các con mỗi ngày."
      ],
      sign: "Con yêu mẹ 💗"
    },
    {
      id: "chi2", name: "Chị Hai", emoji: "🌷", accent: "#c9a5ee",
      title: "Gửi chị Hai",
      paragraphs: [
        "Chị Hai ơi, cảm ơn chị vì đã luôn là người đi trước dắt em bước, là chỗ dựa mỗi khi em chênh vênh. Có chị ở bên, em thấy mình mạnh mẽ hơn rất nhiều.",
        "Nhân ngày 20/10, em chúc chị công việc thuận lợi, luôn xinh đẹp và có thật nhiều thời gian cho bản thân. Chị cũng xứng đáng được chăm sóc như cách chị vẫn chăm sóc mọi người."
      ],
      wishes: [
        "Chúc chị Hai luôn rạng rỡ và gặp thật nhiều điều may mắn.",
        "Cảm ơn chị vì đã luôn mạnh mẽ vì cả nhà. Hôm nay chị hãy nghỉ ngơi nhé!",
        "Mong mọi dự định của chị đều nở hoa đúng lúc."
      ],
      sign: "Em của chị 💜"
    },
    {
      id: "chi3", name: "Chị Ba", emoji: "🌼", accent: "#f7c08e",
      title: "Gửi chị Ba",
      paragraphs: [
        "Chị Ba ơi, cảm ơn chị vì đã là người bạn thân nhất của em: lúc nào cũng lắng nghe, chia sẻ và cùng em cười thật to. Những kỷ niệm với chị là điều em luôn trân trọng.",
        "Nhân ngày 20/10, em chúc chị luôn vui vẻ, khỏe mạnh và tỏa sáng theo cách của riêng mình. Mong chị gặp được thật nhiều niềm vui và hạnh phúc."
      ],
      wishes: [
        "Chúc chị Ba luôn xinh đẹp, vui vẻ và tràn đầy năng lượng.",
        "Có chị, em thấy cuộc sống này vui hơn rất nhiều. Cảm ơn chị!",
        "Mong chị luôn được yêu thương và được là chính mình."
      ],
      sign: "Em của chị 🧡"
    }
  ];

  /* ====== CODE HIỂN THỊ (không cần sửa) ====== */
  var tabsEl = document.getElementById("tabs");
  var letterEl = document.getElementById("letter");
  var wishIndex = {};

  function render(id, animate) {
    var p = people.filter(function (x) { return x.id === id; })[0];
    letterEl.style.setProperty("--accent", p.accent);
    letterEl.innerHTML =
      '<span class="emoji">' + p.emoji + '</span>' +
      '<h3>' + p.title + '</h3>' +
      '<div class="body">' + p.paragraphs.map(function (t) { return '<p>' + t + '</p>'; }).join("") + '</div>' +
      '<p class="sign">' + p.sign + '</p>' +
      '<div class="wish-box"><div class="wish-text" id="wishText">Bấm nút để nhận thêm một lời chúc dành cho ' + p.name + '.</div>' +
      '<button class="btn btn-small" type="button" id="wishBtn">Thêm một lời chúc</button></div>';
    letterEl.classList.remove("swap");
    if (animate) { void letterEl.offsetWidth; letterEl.classList.add("swap"); }
    document.getElementById("wishBtn").addEventListener("click", function () {
      var i = wishIndex[id] === undefined ? 0 : (wishIndex[id] + 1) % p.wishes.length;
      wishIndex[id] = i;
      document.getElementById("wishText").textContent = p.wishes[i];
    });
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute("aria-selected", b.dataset.id === id ? "true" : "false");
    });
  }

  people.forEach(function (p) {
    var b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.dataset.id = p.id; b.textContent = p.emoji + " " + p.name;
    b.addEventListener("click", function () { render(p.id, true); });
    tabsEl.appendChild(b);
  });
  render(people[0].id, false);

  // Cánh hoa rơi
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var box = document.getElementById("petals");
    for (var i = 0; i < 22; i++) {
      var s = document.createElement("span");
      s.className = "petal";
      s.style.left = Math.random() * 100 + "%";
      s.style.setProperty("--s", 10 + Math.random() * 14 + "px");
      s.style.setProperty("--d", 9 + Math.random() * 10 + "s");
      s.style.setProperty("--delay", -Math.random() * 18 + "s");
      s.style.setProperty("--x", (Math.random() * 160 - 80) + "px");
      box.appendChild(s);
    }
  })();
</script>
</body>
</html>
